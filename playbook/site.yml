- name: Install Clickhouse
  hosts: clickhouse
  vars:
    clickhouse_networks_default: 
      - "::/0"
    clickhouse_http_port: 8123
    clickhouse_listen_host_custom:
      - "{{ hostvars['clickhouse-01'].ansible_default_ipv4.address }}"
  roles:
      - {role: clickhouse}
  tasks:
    - name: Create database
      ansible.builtin.command: "clickhouse-client --host 127.0.0.1 -q '{{ create_db }}'"
      register: create_db
      failed_when: create_db.rc != 0 and create_db.rc !=82
      changed_when: create_db.rc == 0
    - name: Create table
      ansible.builtin.command: "clickhouse-client --host 127.0.0.1 -q '{{ create_table }}'"
      register: create_table

- name: Install Lighthouse
  hosts: lighthouse
  roles:
    - {role: lighthouse}
  

- name: Install Vector to server
  hosts: vector-server, lighthouse
  roles:
    - {role: vector}
  tags: ["end"]